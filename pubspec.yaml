name: launcher
description: "A home laucher for android."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_modular: ^7.1.0
  installed_apps: ^2.1.1
  flutter_mobx: ^2.3.0
  mobx: ^2.6.0
  cupertino_icons: ^1.0.8
  hive_ce: ^2.19.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  lucide_icons_flutter: ^3.1.15
  flutter_launcher_icons: ^0.14.4
  battery_plus: ^7.1.1
  wallpaper_manager_plus: ^2.0.4
  file_picker: ^11.0.2
  pie_menu: ^3.8.3

dev_dependencies:
  build_runner: ^2.15.1
  hive_ce_generator: ^1.11.2
  mobx_codegen: ^2.7.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Exo2
      fonts:
        - asset: assets/static/Exo2-Regular.ttf
        - asset: assets/static/Exo2-Bold.ttf
          weight: 700
  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21